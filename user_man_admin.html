<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Skillera Admin (India Edition)</title>
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0d1117;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Table */
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .user-table th, .user-table td {
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-table th {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-table tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Buttons */
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            font-weight: bold;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .edit-btn { background: #3498db; }
        .delete-btn { background: #e74c3c; }
        .approve-btn { background: #2ecc71; }
        .reject-btn { background: #f1c40f; }
        .ban-btn { background: #e74c3c; }
        .unban-btn { background: #2ecc71; }

        /* Popup Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .modal input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        .modal button {
            margin-top: 10px;
        }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .user-table {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h1>Skillera Admin - User Management 🇮🇳</h1>

    <table class="user-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTable">
            <tr>
                <td>1</td>
                <td>Amit Sharma</td>
                <td>amit.sharma@gmail.com</td>
                <td><span class="status">Active</span></td>
                <td>
                    <button class="btn edit-btn" onclick="editUser(1)">Edit</button>
                    <button class="btn delete-btn" onclick="deleteUser(1)">Delete</button>
                    <button class="btn approve-btn" onclick="approveResume(1)">Approve</button>
                    <button class="btn reject-btn" onclick="rejectResume(1)">Reject</button>
                    <button class="btn ban-btn" onclick="banUser(1)">Ban</button>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>Priya Verma</td>
                <td>priya.verma@yahoo.in</td>
                <td><span class="status">Banned</span></td>
                <td>
                    <button class="btn edit-btn" onclick="editUser(2)">Edit</button>
                    <button class="btn delete-btn" onclick="deleteUser(2)">Delete</button>
                    <button class="btn approve-btn" onclick="approveResume(2)">Approve</button>
                    <button class="btn reject-btn" onclick="rejectResume(2)">Reject</button>
                    <button class="btn unban-btn" onclick="unbanUser(2)">Unban</button>
                </td>
            </tr>
            <tr>
                <td>3</td>
                <td>Rahul Mehta</td>
                <td>rahul.mehta@rediffmail.com</td>
                <td><span class="status">Active</span></td>
                <td>
                    <button class="btn edit-btn" onclick="editUser(3)">Edit</button>
                    <button class="btn delete-btn" onclick="deleteUser(3)">Delete</button>
                    <button class="btn approve-btn" onclick="approveResume(3)">Approve</button>
                    <button class="btn reject-btn" onclick="rejectResume(3)">Reject</button>
                    <button class="btn ban-btn" onclick="banUser(3)">Ban</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Edit User Modal -->
    <div class="overlay" id="overlay"></div>
    <div class="modal" id="editModal">
        <h2>Edit User</h2>
        <input type="text" id="editName" placeholder="Enter Name">
        <input type="email" id="editEmail" placeholder="Enter Email">
        <button class="btn approve-btn" onclick="saveUser()">Save</button>
        <button class="btn delete-btn" onclick="closeModal()">Cancel</button>
    </div>

    <script>
        function editUser(userId) {
            document.getElementById("overlay").style.display = "block";
            document.getElementById("editModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("editModal").style.display = "none";
        }

        function saveUser() {
            alert("User details updated!");
            closeModal();
        }

        function deleteUser(userId) {
            if (confirm("Are you sure you want to delete this user?")) {
                alert("User deleted!");
            }
        }

        function approveResume(userId) {
            alert("Resume Approved!");
        }

        function rejectResume(userId) {
            alert("Resume Rejected!");
        }

        function banUser(userId) {
            alert("User Banned!");
        }

        function unbanUser(userId) {
            alert("User Unbanned!");
        }
    </script>

</body>
</html>
