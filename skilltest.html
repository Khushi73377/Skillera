        // Function to dynamically load questions based on skill selection
        function loadQuestions() {
    const skill = document.getElementById("skill").value;
    const form = document.getElementById("quiz-form");
    form.innerHTML = "";

    if (skill && questions[skill]) {
        questions[skill].forEach((q, index) => {
            const questionDiv = document.createElement("div");
            questionDiv.classList.add("question");
            questionDiv.innerHTML = `<p>${index + 1}. ${q.question}</p>`;
            
            q.options.forEach((option, optIndex) => {
                questionDiv.innerHTML += `
                    <label>
                        <input type="radio" name="q${index}" value="${optIndex}"> ${option}
                    </label><br>
                `;
            });
            
            form.appendChild(questionDiv);
        });

        // Add Submit Button
        const submitBtn = document.createElement("button");
        submitBtn.type = "button";
        submitBtn.textContent = "Submit Test";
        submitBtn.onclick = submitQuiz;
        form.appendChild(submitBtn);
    }
        }
      
        // Function to submit quiz and validate that all questions are answered
        function submitQuiz() {
    const form = document.getElementById("quiz-form");
    const questionsAnswered = form.querySelectorAll("input[type='radio']:checked").length;
    const totalQuestions = form.querySelectorAll(".question").length;

    if (questionsAnswered < totalQuestions) {
        document.getElementById("error-message").style.display = "block";
    } else {
        alert("Test submitted successfully!");
        document.getElementById("error-message").style.display = "none";
    }
}

let score = 0;

function loadQuestions() {
    let skill = document.getElementById("skill").value;
    let quizForm = document.getElementById("quiz-form");
    quizForm.innerHTML = ""; // Clear previous questions
    
    if (skill && questions[skill]) {
        questions[skill].forEach((q, index) => {
            let questionHTML = `
                <div class="question">
                    <p>${index + 1}. ${q.question}</p>
                    ${q.options.map((option, i) =>
                        `<label><input type="radio" name="q${index}" value="${i}"> ${option}</label><br>`).join('')}
                </div>`;
            quizForm.innerHTML += questionHTML;
        });
        quizForm.innerHTML += `<button type="button" onclick="submitQuiz()">Submit Test</button>`;
    }
}

function submitQuiz() {
    let skill = document.getElementById("skill").value;
    let selectedAnswers = document.querySelectorAll('input[type="radio"]:checked');
    let totalQuestions = questions[skill].length;
    
    if (selectedAnswers.length !== totalQuestions) {
        document.getElementById("error-message").style.display = "block";
        return;
    }
    
    score = 0;
    selectedAnswers.forEach((answer, index) => {
        if (parseInt(answer.value) === questions[skill][index].answer) {
            score++;
        }
    });

    if (score >= 8) {
        let jobId = new URLSearchParams(window.location.search).get('job_id');
        window.location.href = `apply.php?job_id=${jobId}`;
    } else {
        alert("You need at least 8/10 to apply for this job. Try again!");
    }
}
