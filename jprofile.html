<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobseeker Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e3f2fd;
            background: url('job13.jpg') no-repeat center top/cover;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            font-weight: 600;
        }

        h2 {
            color: #1565c0;
            border-bottom: 2px solid #1565c0;
            padding-bottom: 5px;
        }

        label {
            font-weight: 500;
            display: block;
            margin: 12px 0 5px;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 6px;
            font-size: 16px;
        }

        input {
            border: 1px solid #bbb;
            background-color: #fafafa;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #1976d2;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0px 0px 5px rgba(25, 118, 210, 0.3);
        }

        button {
            background-color: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0d47a1;
        }

        section {
            margin-bottom: 20px;
        }

        #skills-container input, #experience-container input {
            width: calc(100% - 20px);
        }

        .error-message {
            color: red;
            font-size: 12px;
        }

        @media screen and (max-width: 768px) {
            .container {
                width: 90%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Jobseeker Profile</h1>
        <form id="profileForm" action="submit_profile.php" method="POST" enctype="multipart/form-data">
            
            <!-- Personal Information -->
            <section>
                <h2>Personal Information</h2>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="johndoe@example.com" required>
                
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required>
                
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" placeholder="123 Main St, City, Country" required>
            </section>

            <!-- Skills Section -->
            <section>
                <h2>Skills</h2>
                <div id="skills-container">
                    <label for="skills">Skills (comma separated):</label>
                    <input type="text" id="skills" name="skills[]" placeholder="e.g., JavaScript, Python, HTML">
                </div>
                <button type="button" id="addSkill">Add Another Skill</button>
            </section>

            <!-- Job Experience Section -->
            <section>
                <h2>Job Experience</h2>
                <div id="experience-container">
                    <label for="jobTitle">Job Title:</label>
                    <input type="text" id="jobTitle" name="jobTitle[]" placeholder="e.g., Software Developer">
                    
                    <label for="company">Company Name:</label>
                    <input type="text" id="company" name="company[]" placeholder="e.g., ABC Corp">
                    
                    <label for="duration">Job Duration:</label>
                    <input type="text" id="duration" name="duration[]" placeholder="e.g., 2 years">
                </div>
                <button type="button" id="addExperience">Add Another Job</button>
            </section>

            <!-- File Uploads -->
            <section>
                <h2>Portfolio</h2>
                <label for="profilePic">Upload Profile Picture:</label>
                <input type="file" id="profilePic" name="profilePic" accept="image/*">

                <label for="resume">Upload Resume (PDF):</label>
                <input type="file" id="resume" name="resume" accept="application/pdf">
            </section>

            <button type="submit">Submit Profile</button>
        </form>
    </div>

    <script>
        
    // Function to add more skill input fields
    document.getElementById('addSkill').addEventListener('click', function() {
        const skillsContainer = document.getElementById('skills-container');
        const newSkillInput = document.createElement('input');
        newSkillInput.type = 'text';
        newSkillInput.name = 'skills[]';
        newSkillInput.placeholder = 'e.g., JavaScript, Python, HTML';
        skillsContainer.appendChild(newSkillInput);
    });

    // Function to add more job experience input fields with labels
    document.getElementById('addExperience').addEventListener('click', function() {
        const experienceContainer = document.getElementById('experience-container');

        // Create Job Title Label and Input
        const jobTitleLabel = document.createElement('label');
        jobTitleLabel.textContent = 'Job Title:';
        experienceContainer.appendChild(jobTitleLabel);

        const jobTitleInput = document.createElement('input');
        jobTitleInput.type = 'text';
        jobTitleInput.name = 'jobTitle[]';
        jobTitleInput.placeholder = 'e.g., Software Developer';
        experienceContainer.appendChild(jobTitleInput);

        // Create Company Name Label and Input
        const companyLabel = document.createElement('label');
        companyLabel.textContent = 'Company Name:';
        experienceContainer.appendChild(companyLabel);

        const companyInput = document.createElement('input');
        companyInput.type = 'text';
        companyInput.name = 'company[]';
        companyInput.placeholder = 'e.g., ABC Corp';
        experienceContainer.appendChild(companyInput);

        // Create Job Duration Label and Input
        const durationLabel = document.createElement('label');
        durationLabel.textContent = 'Job Duration:';
        experienceContainer.appendChild(durationLabel);

        const durationInput = document.createElement('input');
        durationInput.type = 'text';
        durationInput.name = 'duration[]';
        durationInput.placeholder = 'e.g., 2 years';
        experienceContainer.appendChild(durationInput);
    });
    </script>
</body>
</html>
