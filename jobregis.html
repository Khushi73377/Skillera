<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seekers & Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            background: url('job16.jpg')no-repeat center top /cover;
            color: white;
            text-align: center;
        }
        .navbar {
            display: flex;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: 0.3s;
        }
        .navbar a:hover {
            color: #ff7eb3;
        }
        .content {
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
            margin: 20px auto;
            color: black;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #007bff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .login-link {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }
        .login-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>For Job Seekers</h1>
        <p>Find the right job based on your skills. Create a profile, take skill tests, and apply for jobs.</p>
    </div>
    <div class="container">
        <h2>Job Seeker Registration</h2>
        <form action="reg_js.php" method="post" id="registration-form">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your personal email" required>
            </div>
            <div class="input-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" name="contact" pattern="[0-9]{10}" placeholder="Enter a 10-digit contact number" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="input-group">
                <button type="submit">Register</button>
            </div>
        </form>
        <div id="message"></div>
        <div class="login-link">
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
    <script>
            document.getElementById('registration-form').addEventListener('submit', function(event) {
           event.preventDefault();
    
    // Assuming validation is successful
       document.getElementById('message').innerHTML = "<span style='color: green;'>Registration successful! Redirecting...</span>";

     setTimeout(function() {
        window.location.href = "jprofile.html"; // Redirect to profile page
    }, 2000);

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const contact = document.getElementById('contact').value;
            const password = document.getElementById('password').value;
            if (!name || !email || !contact || !password) {
                document.getElementById('message').innerHTML = "<span style='color: red;'>Please fill all fields.</span>";
                return;
            }
            const contactPattern = /^[0-9]{10}$/;
            if (!contact.match(contactPattern)) {
                document.getElementById('message').innerHTML = "<span style='color: red;'>Please enter a valid 10-digit contact number.</span>";
                return;
            }
            document.getElementById('message').innerHTML = "<span style='color: green;'>Registration successful!</span>";
            console.log('Form submitted successfully:', { name, email, contact, password });
            document.getElementById('registration-form').reset();
        });
    </script>
</body>
</html>
